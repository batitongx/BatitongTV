name: BatitongTV CI Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify BatitongTV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Cloudflare Worker Gateway Syntax (node --check)
        run: |
          echo "Verifying gateway syntax..."
          node --check gateway/worker.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & CMake
        uses: android-actions/setup-android@v3

      - name: Install CMake & NDK via SDKManager
        run: |
          yes | sdkmanager --install "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper missing or incomplete, generating via gradle wrapper..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Run JVM Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatitongTV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
